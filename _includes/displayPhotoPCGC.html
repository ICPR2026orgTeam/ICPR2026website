



   <div class="col-4 col-sm-4 col-md-3 col-lg-2 mb-2 " >


        <article class="keynotespeaker-item">

          <!-- IMAGE -->
          <div class="speaker-img-wrapper mb-2">
            <img src="{{ site.baseurl }}/Images/{{include.photoName}}" alt="Photo {{include.name}}" class="member-img">
          </div>

          <!-- NAME -->
          <h6 class="speaker-name mb-0">
            {% if include.link  %}
            <a href="{{ include.link }}">{{include.name}}</a>
            {% else %}
            {{include.name}}
            {% endif %}
          </h6>

        </article>
     
   </div>
