


  <!------ Section Board Team ----->
   <div class="col-4 col-sm-4 col-md-3 col-lg-2 mb-2 " >


  
      <a href="{{ ks.url | relative_url  }}"> 
        <article class="keynotespeaker-item">

          <!-- IMAGE -->
          <div class="speaker-img-wrapper mb-2">
            <img src="{{ site.baseurl }}/Images/{{include.photoName}}" alt="Photo {{include.name}}" class="speaker-img">
          </div>

          <!-- NAME -->
          <h6 class="speaker-name mb-0">
            <a href="{{ ks.url }}">{{include.name}}</a>
          </h6>

          <!-- UNIVERSITY -->
         <small class="speaker-univrsity text-muted">
           {{include.affiliation}}
          </small>
         {% if include.role %}
         <h6 class="speaker-name mb-0">
           {{ include.role }}
          </h6>
         {% endif %}
        </article>
      </a>
</div>
