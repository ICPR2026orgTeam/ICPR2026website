- sessionId: "S4" 
  title: "Closing & Awards"
  codePlace: "A"
  chair: ""
  mainContent: |
               <p>Join us for the ICPR 2026 Closing &amp; Awards Ceremony, where we will celebrate the conference's outstanding contributions. Awards will be presented for the Best Student Paper Award, Best Scientific Award, and other distinctions.</p>
               <p><span class="champagne-toast" aria-hidden="true"><svg class="champagne-toast__glass champagne-toast__glass--left" viewBox="0 0 32 64"><path class="champagne-toast__bowl" d="M6 4h20l-2 22c-.5 6-3.5 10-8 10S8.5 32 8 26L6 4Z"/><path class="champagne-toast__drink" d="M8 18h16l-1 9c-.5 5-3 8-7 8s-6.5-3-7-8l-1-9Z"/><path class="champagne-toast__stem" d="M16 36v21M8 59h16"/></svg><svg class="champagne-toast__glass champagne-toast__glass--right" viewBox="0 0 32 64"><path class="champagne-toast__bowl" d="M6 4h20l-2 22c-.5 6-3.5 10-8 10S8.5 32 8 26L6 4Z"/><path class="champagne-toast__drink" d="M8 18h16l-1 9c-.5 5-3 8-7 8s-6.5-3-7-8l-1-9Z"/><path class="champagne-toast__stem" d="M16 36v21M8 59h16"/></svg><span class="champagne-toast__spark">✦</span></span>The ceremony will conclude with a farewell toast, offering everyone a final opportunity to celebrate together and mark the close of ICPR 2026.</p>
               <p><strong>Location:</strong> Main conference center.</p>

- sessionId: "S5" 
  title: "Lunch break with Women at ICPR"
  codePlace: "J"
  chair: "Alexandra Branzan-Albu"
  mainContent: |
               Welcome to join lunch in a reserved area where we can bring our lunch boxes and sit down with other colleagues interested in activities and discussions on women in academic and non-academic environments. The local organisers kindly support this event with 50 complimentary lunch boxes that will be distributed on a first-come-first serve basis. After we have had lunch together, we will close the event and leave in time for the plenary session and panel discussion on Breaking through Career Roadblocks starting at 14:00 in the Main Auditorium, see <a href="/sessions/oral1W/"> Oral1w</a>.


- sessionId: "S6" 
  title: "ICPR Group Photography"
  codePlace: "F"
  chair: "Main ICPR photograph"
  mainContent: |
               A special moment to bring all participants together and capture a lasting memory of ICPR 2026.
               

