- sessionId: "S5" 
  title: "Lunch break with Women at ICPR"
  codePlace: "J"
  chair: "Alexandra Branzan-Albu"
  mainContent: |
               Welcome to join lunch in a reserved area where we can bring our lunch boxes and sit down with other colleagues interested in activities and discussions on women in academic and non-academic environments. The local organisers kindly support this event with 50 complimentary lunch boxes that will be distributed on a first-come-first serve basis. After we have had lunch together, we will close the event and leave in time for the plenary session and panel discussion on Breaking through Career Roadblocks starting at 14:00 in the Main Auditorium, see <a href="/sessions/oral1W/"> Oral1w</a>.


