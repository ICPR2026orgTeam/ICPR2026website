- sessionId: "3W" 
  title: "IAPR Technical Committees (reserved to TC chairs)"
  codePlace: "H"
  mainContent: |
               IAPR Technical Committees (TCs) are expert groups within IAPR dedicated to specific areas of pattern recognition. This meeting brings together TC chairs to review their activities and receive recommendations. See the list of TCs on the <a href="https://iapr.org/committees/technical-committees">IAPR TC page</a>.
  chair: "Jose Francisco Martinez-Trinidad"

- sessionId: "4W" 
  title: "IAPR Governing Board Meeting (reserved to governing board members)"
  codePlace: "J"
  chair: ""
  mainContent: " <p>The IAPR Governing Board oversees the activities and strategic directions of IAPR. This meeting is reserved for Governing Board members. Topics typically include IAPR activities, reports from Technical Committees, financial and administrative matters, future conferences, membership, new initiatives, and governance matters.</p>
"

