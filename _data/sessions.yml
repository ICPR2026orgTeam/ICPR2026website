- sessionId: "6W" 
  title: "Doctorial Consortium"
  codePlace: "L"
  chair: "Mansour Mayaki"
  mainContent: |
               <h2>Join Us for the ICPR 2026 Doctoral Consortium!  </h2>
               <p> Interested in engaging with the rising talent of our academic community?</p>
               <p>Join us for an interactive, fast-paced <b class="text-info">Doctoral Consortium</b> featuring <b class="text-info">30 outstanding PhD researchers</b> showcasing their ongoing thesis work!</p>
               <h3>Highlights of the Session </h3>
               <ul>
               <li><b>Lightning Pitches</b>: Hear a rapid presentations highlighting cutting-edge PhD projects and core research challenges.</li>
               <li><b>Interactive Poster & Networking Session</b>: Meet the PhD candidates, explore innovative methodologies, and connect directly with senior academic and industry mentors</li>
               </ul>
               <p>Whether you are looking to offer feedback, explore potential research collaborations, or recruit top-tier talent, you are welcome to join us.</p>
               <b class="text-info">All ICPR attendees are warmly invited to drop in and participate!</b>
